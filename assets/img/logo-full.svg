<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Símbolo -->
    <linearGradient id="tc-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Gradiente de Brilho Central (Match) -->
    <radialGradient id="tc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="1" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- SÍMBOLO / ÍCONE (Radar + Match) -->
  <g transform="translate(10, 10)">
    <!-- Base sutil / Moldura -->
    <rect width="100" height="100" rx="24" fill="#0F172A" />

    <!-- Arcos de Varredura / Radar -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="#1E293B" stroke-width="2" />
    <path d="M 50 16 A 34 34 0 0 1 84 50" fill="none" stroke="url(#tc-brand-grad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 16 50 A 34 34 0 0 1 50 84" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" />

    <!-- Miras / Retículas de Comparação -->
    <line x1="50" y1="20" x2="50" y2="34" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="66" x2="50" y2="80" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="50" x2="34" y2="50" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="66" y1="50" x2="80" y2="50" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <!-- Pontos de Conexão (Candidato vs Vaga) -->
    <!-- Ponto A (Vaga) -->
    <circle cx="34" cy="38" r="4.5" fill="#6366F1" />
    <line x1="34" y1="38" x2="50" y2="50" stroke="#6366F1" stroke-width="2" stroke-dasharray="2 3" />

    <!-- Ponto B (Candidato) -->
    <circle cx="66" cy="62" r="4.5" fill="#3B82F6" />
    <line x1="66" y1="62" x2="50" y2="50" stroke="#3B82F6" stroke-width="2" stroke-dasharray="2 3" />

    <!-- Centro / The Match (Talento Capturado) -->
    <circle cx="50" cy="50" r="14" fill="url(#tc-glow)" opacity="0.35" />
    <circle cx="50" cy="50" r="6" fill="#22D3EE" />
    <circle cx="50" cy="50" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- TIPOGRAFIA -->
  <g transform="translate(132, 0)">
    <!-- Nome Principal: TALENT -->
    <text x="0" y="75" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5" fill="#0F172A">
      TALENT
    </text>
    
    <!-- Nome Principal: CATCHER -->
    <text x="195" y="75" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5" fill="#2563EB">
      CATCHER
    </text>

    <!-- Tagline / Posicionamento -->
    <!-- <text x="2" y="85" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.8" fill="#64748B">
      AI MATCHING &amp; RECRUITMENT
    </text> -->

    <!-- Ponto de Destaque / Conexão Visual -->
    <!-- <circle cx="316" cy="54" r="4" fill="#22D3EE" /> -->
  </g>
</svg>
