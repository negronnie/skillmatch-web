<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Catcher - Você compatível com o mercado!</title>
    <meta name="description" content="Compare as vagas disponíveis com o seu currículo, descubra seu índice de compatibilidade e receba recomendações personalizadas de estudo.">
    <link rel="stylesheet" href="./assets/styles/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="brand">
                <img src="https://avatars.githubusercontent.com/u/24555177" class="logo" alt="Logo do Talent Catcher">
            </div>
            <nav class="site-nav">
                <ul class="nav-list">
                    <li><a href="#candidato" class="nav-link">Candidato</a></li>
                    <li><a href="#vagas" class="nav-link">Vagas</a></li>
                </ul>
            </nav>
            <div class="actions">
                <button id="btn-theme" class="btn-theme">Modo Escuro</button>
            </div>
        </div>
    </header>

    <main id="principal">
        
        <section id="hero" class="section-card hero">
            <div class="section-header">
                <h1 class="section-title" id="main-title">Talent Catcher: Você compatível com o mercado!</h1>
                <p class="section-subtitle">
                    Cadastre suas informações profissionais e adicione suas habilidades. 
                    Seu perfil será comparado com as exigências do mercado para calcular seu percentual de compatibilidade.
                </p>
            </div>
        </section>

        <section id="candidato" class="section-card">
            <div class="section-header">
                <h2>Candidato</h2>
            </div>
            <form id="form-candidato" class="form-candidate">

                <fieldset class="form-fieldset">
                    <legend class="form-legend">Informações Pessoais e Profissionais</legend>
                    <div class="form-row">
                        <div class="form-group flex1">
                            <label for="candidate-name" class="form-label">Nome Completo</label>
                            <input type="text" id="candidade-name" class="form-input">
                        </div>

                        <div class="form-group flex1">
                            <label for="candidate-area" class="form-label">Área de Interesse</label>
                            <select name="area" id="candidate-area" class="form-select" required>
                                <option value="">Selecione uma área...</option>
                                <option value="front-end">Front-End</option>
                                <option value="back-end">Back-End</option>
                                <option value="fullstack">Fullstack</option>
                                <option value="ui-ux">UI/UX &amp; Design Systems</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="candidate-experience" class="form-label">Experiência Total (Anos)</label>
                            <input type="number" id="candidade-experience" class="form-input">
                        </div>
                    </div>
                </fieldset>


            </form>
        </section>



        
        <section id="destaque">
        
        </section>

        <section id="vagas" class="section-card">
            <div class="section-header">
                <h2>Vagas</h2>
            </div>
        </section>
    </main>
    <footer>

    </footer>
    
    <script src="./assets/scripts/main.js" type="module"></script>
</body>
</html>
